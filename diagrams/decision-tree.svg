<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>

  <!-- Start -->
  <rect x="350" y="10" width="200" height="50" rx="8" fill="#1f3a5f" />
  <text x="450" y="40" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Score 4 Dimensions</text>

  <!-- Arrow down -->
  <line x1="450" y1="60" x2="450" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Composite calc -->
  <rect x="300" y="100" width="300" height="55" rx="8" fill="#2c5282"/>
  <text x="450" y="122" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Calculate Weighted Composite</text>
  <text x="450" y="142" text-anchor="middle" fill="#cbd5e0" font-size="11">Cost 35% / TechDebt 25% / Downtime 20% / Compliance 20%</text>

  <line x1="450" y1="155" x2="450" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Composite ranges -->
  <rect x="60" y="195" width="180" height="60" rx="6" fill="#2f855a"/>
  <text x="150" y="218" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1.0 - 1.8</text>
  <text x="150" y="238" text-anchor="middle" fill="#fff" font-size="13">Refactor</text>

  <rect x="260" y="195" width="180" height="60" rx="6" fill="#2b6cb0"/>
  <text x="350" y="218" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1.9 - 2.6</text>
  <text x="350" y="238" text-anchor="middle" fill="#fff" font-size="13">Re-platform</text>

  <rect x="460" y="195" width="200" height="60" rx="6" fill="#b7791f"/>
  <text x="560" y="216" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2.7 - 3.4</text>
  <text x="560" y="236" text-anchor="middle" fill="#fff" font-size="12">Lift-and-shift +</text>
  <text x="560" y="250" text-anchor="middle" fill="#fff" font-size="12">re-platform roadmap</text>

  <rect x="680" y="195" width="180" height="60" rx="6" fill="#c53030"/>
  <text x="770" y="216" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3.5 - 4.0</text>
  <text x="770" y="236" text-anchor="middle" fill="#fff" font-size="12">Lift-and-shift only</text>
  <text x="770" y="250" text-anchor="middle" fill="#fff" font-size="11">(revisit later)</text>

  <!-- connecting lines from composite box to ranges -->
  <line x1="380" y1="155" x2="150" y2="195" stroke="#888" stroke-width="1.5"/>
  <line x1="420" y1="155" x2="350" y2="195" stroke="#888" stroke-width="1.5"/>
  <line x1="480" y1="155" x2="560" y2="195" stroke="#888" stroke-width="1.5"/>
  <line x1="520" y1="155" x2="770" y2="195" stroke="#888" stroke-width="1.5"/>

  <!-- Arrow down to override check -->
  <line x1="450" y1="255" x2="450" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Override diamond -->
  <polygon points="450,300 600,360 450,420 300,360" fill="#742a2a" stroke="#fff" stroke-width="1"/>
  <text x="450" y="350" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Compliance = 4</text>
  <text x="450" y="368" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">or Downtime = 4?</text>

  <!-- Yes branch -->
  <line x1="600" y1="360" x2="700" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="350" text-anchor="middle" font-size="12" fill="#333">Yes</text>
  <rect x="700" y="330" width="180" height="65" rx="6" fill="#742a2a"/>
  <text x="790" y="352" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Mandatory Override</text>
  <text x="790" y="368" text-anchor="middle" fill="#fff" font-size="10">Controls/parallel-run</text>
  <text x="790" y="382" text-anchor="middle" fill="#fff" font-size="10">required regardless</text>

  <!-- No branch -->
  <line x1="450" y1="420" x2="450" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="445" text-anchor="middle" font-size="12" fill="#333">No</text>

  <!-- Final strategy -->
  <rect x="330" y="465" width="240" height="55" rx="8" fill="#1f3a5f"/>
  <text x="450" y="497" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Final Strategy Confirmed</text>

  <line x1="450" y1="520" x2="450" y2="555" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sequencing -->
  <rect x="280" y="560" width="340" height="65" rx="8" fill="#4a5568"/>
  <text x="450" y="585" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Apply Sequencing Logic</text>
  <text x="450" y="603" text-anchor="middle" fill="#cbd5e0" font-size="10">Pilot (low-risk) → Compliance-gated → High-downtime-sensitivity</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
